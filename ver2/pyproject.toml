[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5GFed"
version = "1.0.0"
description = "Federated Learning with RpI and 5G; Collaborative research with NU and ANL"
license = "Apache-2.0"
dependencies = [
    "flwr",
    "flwr-datasets",
    "torch",
    "torchvision",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Robert Hayek"

[tool.flwr.app.components]
serverapp = "NextGfedNU.server_app:app"
clientapp = "NextGfedNU.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 10
fraction-evaluate = 1
local-epochs = 3
learning-rate = 0.1
batch-size = 16

[tool.flwr.federations]
default = "nextg-federation"

[tool.flwr.federations.embedded-federation]
address = "localhost:9093"
insecure = true