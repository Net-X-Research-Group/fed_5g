name: Build FL Server Docker Image

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-client:
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: fl-client
      dockerfile_path: ./docker/client/Dockerfile
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}