program: sweep.py
method: bayes
metric:
  goal: maximize
  name: val_acc
parameters:
  rounds:
    values: [300]
  learning_rate:
    values: [0.001, 0.0001]
  momentum:
    values: [0.9]
  weight_decay:
    values: [0, 1e-4, 1e-5]
  epochs:
    values: [1, 2, 3, 4, 5]
  batch_size:
    values: [8, 16, 32, 64, 128]