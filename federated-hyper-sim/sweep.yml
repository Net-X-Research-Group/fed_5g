program: sweep.py
method: bayes
metric:
  goal: minimize
  name: val_acc
parameters:
  rounds:
    values: [200]
  learning_rate:
    distribution: uniform
    min: 0
    max: 0.1
  momentum:
    values: [0.9]
  weight_decay:
    distribution: log_uniform_values
    min: 1e-6
    max: 0.1
  epochs:
    values: [1, 2, 3, 4, 5]
  batch_size:
    values: [8, 16, 32, 64, 128]